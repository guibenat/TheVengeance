<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>The Vengeance</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <div class="logo">
          <img src="assets/icon/logo.png" alt="Logo Batman" />
        </div>
        <div class="nav-links">
          <ul>
            <a href="">UNIVERSE</a>
            <a href="">HISTORY</a>
            <img src="assets/icon/charada.png" alt="Charada" />
            <a href="">PERSONS</a>
            <a href="">DASHBOARD</a>
          </ul>
        </div>
        <div class="nav-links">
          <a href="">LOG-IN</a>
          <a href="">LOG-OUT</a>
        </div>
      </nav>
    </header>

    <section class="entrada-section">
      <img src="assets/imgs/entradaBatman.jpg" alt="" />
    </section>
    <!-- Seção Historia-->
    <section class="historia-section">
      <div class="historia-container">
        <div class="historia-left">
          <h1>History</h1>
          <div class="buttons-historia">
            <button class="btn-universe">UNIVERSE</button>
            <button class="btn-batman">Batman</button>
          </div>
          <div class="carrossel-historia">
            <div class="card-historia">
              <img src="assets/imgs/PiadaMortal.png" alt="Historia 1" />
            </div>
            <div class="card-historia">
              <img src="assets/imgs/cavaleiroDasTrevas.png" alt="Historia 2" />
            </div>
            <div class="card-historia">
              <img src="assets/imgs/quedaMorcego.png" alt="Historia 3" />
            </div>
          </div>
          <p>It’s not who I am on the inside; it’s what I do that defines me.</p>
        </div>

        <div class="historia-right">
          <img src="assets/imgs/batmanHistoriaRight.png" alt="Batman" />
        </div>
      </div>
    </section>

  </body>
</html>
