<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vengeance | Login</title>

  <script src="./js/sessao.js"></script>
  <link rel="stylesheet" href="./css/cadLog.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="alerta_erro">
    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
    </div>
  </div>

  <div class="container">
    <div class="left-panel">
      <img src="./assets/icon/logo.png" alt="Logo The Vengeance" class="logo" />

      <h1>Login</h1>
      <p class="subtitle">Enter your credentials to access your account</p>

      <div class="toggle-tabs">
        <button class="toggle-btn active">Email</button>
      </div>

      <div class="formulario">
        <div class="campo">
          <span>Email</span>
          <input id="email_input" type="text" placeholder="Enter your email" />
        </div>
        <div class="campo">
          <span>Password</span>
          <input id="senha_input" type="password" placeholder="******" />
        </div>

        <button class="botao" onclick="entrar()">Sign in</button>
        
        <div style="margin-top: 15px; font-size: 0.85rem; text-align: center; color: #ccc;">
          Don't have an account? <a href="cadastro.html" style="color: #e52421; text-decoration: none; font-weight: bold;">Sign up</a>
        </div>
      </div>

      <div id="div_aguardar" class="loading-div">
        <img src="./assets/circle-loading.gif" id="loading-gif" width="40" />
      </div>
      <div id="div_erros_login"></div>
    <div class="right-panel">
      <div class="news-title">NEWS</div>
    </div>
      
      <div class="carousel-wrapper">
        <div class="carousel-track" id="track">
          <img src="assets/imgs/penguinPoster.png" alt="News 1">
          <img src="assets/imgs/batmanPoster.png" alt="News 2">
          <img src="assets/imgs/caraDeBarroPoster.png" alt="News 3">
        </div>
      </div>
      <div class="indicators" id="indicators">
        <div class="dot active"><div class="dot-fill"></div></div>
        <div class="dot"><div class="dot-fill"></div></div>
        <div class="dot"><div class="dot-fill"></div></div>
      </div>
    </div>
  </div>
  <script>
    const track = document.getElementById('track');
    const dots = document.querySelectorAll('.dot');
    let slideAtual = 0;
    const tempoIntervalo = 5000; 

    function moverCarrossel() {
      slideAtual = (slideAtual + 1) % dots.length;
      track.style.transform = `translateX(-${slideAtual * 100}%)`;

      dots.forEach(dot => {
        dot.classList.remove('active');
        void dot.offsetWidth; 
      });
      dots[slideAtual].classList.add('active');
    }
    setInterval(moverCarrossel, tempoIntervalo);

    // --- Lógica de Autenticação
    function aguardar() {
      document.getElementById('div_aguardar').style.display = 'flex';
    }

    function finalizarAguardar(texto) {
      document.getElementById('div_aguardar').style.display = 'none';
      if(texto) {
        document.getElementById('div_erros_login').innerHTML = texto;
      }
    }

    function sumirMensagem() {
      document.getElementById('cardErro').style.display = "none";
      document.getElementById('cardErro').style.backgroundColor = "#e52421";
    }

    function entrar() {
      aguardar();

      var emailVar = document.getElementById('email_input').value;
      var senhaVar = document.getElementById('senha_input').value;
      var cardErro = document.getElementById('cardErro');
      var mensagem_erro = document.getElementById('mensagem_erro');

      if (emailVar == "" || senhaVar == "") {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Por favor, preencha todos os campos.";
        finalizarAguardar();
        return false;
      } else {
        setTimeout(sumirMensagem, 5000);
      }

      console.log("FORM LOGIN: ", emailVar);

      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          emailServer: emailVar,
          senhaServer: senhaVar
        })
      }).then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(json => {
            sessionStorage.EMAIL_USUARIO = json.email;
            sessionStorage.NOME_USUARIO = json.nome;
            sessionStorage.ID_USUARIO = json.id;

            cardErro.style.display = "block";
            cardErro.style.backgroundColor = "#28a745"; 
            mensagem_erro.innerHTML = "Login realizado com sucesso! Redirecionando...";

            setTimeout(function () {
              window.location = "./cards.html";
            }, 1000);
          });
        } else {
          resposta.text().then(texto => {
            console.error(texto);
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "E-mail e/ou senha inválidos.";
            finalizarAguardar(texto);
          });
        }
      }).catch(function (erro) {
        console.log(erro);
        finalizarAguardar();
      });

      return false;
    }
  </script>
</body>
</html>
