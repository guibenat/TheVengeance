<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Psicológica - Gotham</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="layout-dashboard">

        <!-- PAINEL LATERAL ESQUERDO -->
        <aside class="sidebar-perfil">
            <div class="sidebar-topo">
                <a href="index.html" class="link-logo">
                    <img src="./assets/logo.png" alt="Logo Morcego" class="logo-morcego">
                </a>
            </div>

            <div class="perfil-match">
                <img id="sidebar-avatar" src="" alt="" class="avatar-principal">
                <h2 id="sidebar-nome-personagem" class="nome-personagem-principal"></h2>
                <div id="sidebar-tags" class="container-tags"></div>
            </div>

            <!-- Card de Características do Usuário -->
            <section class="card-sidebar-stats">
                <h3 class="titulo-secao-sidebar">Características</h3>
                <div id="lista-stats-usuario" class="lista-barras-sidebar"></div>
            </section>

            <!-- Bloco Inferior: Others e Nemesis -->
            <div class="grid-inferior-sidebar">
                <div class="coluna-inferior">
                    <h3 class="titulo-fora-card">Others</h3>
                    <div id="sidebar-others" class="card-sidebar-sub"></div>
                </div>

                <div class="coluna-inferior">
                    <h3 class="titulo-fora-card alinhar-direita">Nemesis</h3>
                    <div class="card-sidebar-sub card-nemesis-mini">
                        <img id="sidebar-nemesis-avatar" src="" alt="" class="avatar-nemesis-mini">
                        <span id="sidebar-nemesis-nome" class="nome-nemesis-mini"></span>
                        <span id="sidebar-nemesis-porcentagem" class="porcentagem-nemesis-mini"></span>
                        <div id="sidebar-nemesis-stats" class="stats-nemesis-mini"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ÁREA PRINCIPAL DIREITA -->
        <main class="conteudo-principal">

            <!-- Barra de Navegação Superior -->
            <header class="navbar-superior">
                <nav class="menu-links">
                    <a href="universe.html" class="nav-item">UNIVERSE</a>
                    <a href="history.html" class="nav-item">HISTORY</a>
                    <a href="quiz.html" class="nav-centro-icone" title="Refazer Quiz">
                        <img src="./assets/riddler-cross.png" alt="Enigma" class="icone-nav-centro">
                    </a>
                    <a href="persons.html" class="nav-item">PERSONS</a>
                    <a href="dashboard.html" class="nav-item ativo">DASHBOARD</a>
                </nav>

                <div class="pill-usuario">
                    <img id="nav-avatar-usuario" src="" alt="" class="avatar-nav">
                    <span id="nav-nome-usuario" class="nome-nav"></span>
                </div>
            </header>

            <!-- Seção Superior: Similar Character + Radar Chart -->
            <section class="secao-similar">
                <div class="cabecalho-secao">
                    <img src="./assets/logo.png" alt="Morcego" class="icone-secao-bat">
                    <h1 class="titulo-secao-principal">Similar character</h1>
                </div>

                <div class="card-escuro card-similar">
                    <div class="similar-topo-grid">
                        <!-- Coluna Esquerda: Badge Hero/Villain + Avatar -->
                        <div class="similar-identidade">
                            <span id="similar-badge-alinhamento" class="badge-alinhamento"></span>
                            <div class="similar-personagem-row">
                                <img id="similar-avatar" src="" alt="" class="avatar-medio">
                                <span id="similar-nome" class="nome-medio"></span>
                            </div>
                        </div>

                        <!-- Coluna Central: Gráfico de Radar -->
                        <div class="similar-radar-box">
                            <canvas id="radarChart"></canvas>
                        </div>

                        <!-- Coluna Direita: Círculo de Match -->
                        <div class="similar-match-box">
                            <div class="circulo-match-vermelho">
                                <span id="similar-porcentagem" class="valor-match"></span>
                                <span class="label-match">Match</span>
                            </div>
                        </div>
                    </div>

                    <div class="divisor-horizontal"></div>

                    <!-- Grid 2 Colunas de Características -->
                    <div class="similar-caracteristicas">
                        <h3 class="subtitulo-card">Características</h3>
                        <div id="grid-stats-similar" class="grid-duas-colunas-stats"></div>
                    </div>
                </div>
            </section>

            <!-- Seção Inferior: Nemesis + Others Similares -->
            <section class="card-escuro card-inferior-completo">
                <div class="bloco-nemesis-grande">
                    <h2 class="subtitulo-card-grande">Nemesis</h2>
                    <div class="nemesis-grande-row">
                        <div class="nemesis-info-esquerda">
                            <img id="main-nemesis-avatar" src="" alt="" class="avatar-grande-nemesis">
                            <div class="nemesis-textos">
                                <h3 id="main-nemesis-nome" class="nome-grande-nemesis"></h3>
                                <p id="main-nemesis-descricao" class="descricao-nemesis"></p>
                            </div>
                        </div>

                        <div class="circulo-match-branco">
                            <span id="main-nemesis-porcentagem" class="valor-match-escuro"></span>
                            <span class="label-match-escuro">Match</span>
                        </div>
                    </div>
                </div>

                <div class="divisor-horizontal"></div>

                <div class="bloco-others-similares">
                    <h3 class="subtitulo-card">Others similares</h3>
                    <div id="grid-others-cards" class="grid-tres-cards"></div>
                </div>
            </section>

        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>

</html>
